<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quarterly Performance Indicators for Store X in 2023</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    .bar { width: 30px; margin: 1px; }
    .axis path, .axis line { shape-rendering: crispEdges; }
    .legend { font-size: 12px; }
  </style>
</head>
<body>
  <h1>Quarterly Performance Indicators for Store X in 2023</h1>
  <svg width="1000" height="750"></svg>
  <script>
    const margin = { top: 30, right: 80, bottom: 60, left: 60 };
    const width = 1000 - margin.left - margin.right;
    const height = 750 - margin.top - margin.bottom;

    const svg = d3.select("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
      .append("g")
      .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    const data = [{"Quarter": "Q1", "Store_Visits": 5467.0, "Electricity_Consumption": 1128.0, "Customer_Comments": 322.0}, {"Quarter": "Q2", "Store_Visits": 5095.0, "Electricity_Consumption": 1393.0, "Customer_Comments": 274.0}, {"Quarter": "Q3", "Store_Visits": 7940.0, "Electricity_Consumption": 793.0, "Customer_Comments": 227.0}, {"Quarter": "Q4", "Store_Visits": 5121.0, "Electricity_Consumption": 1036.0, "Customer_Comments": 376.0}];
    const categories = ["Store_Visits", "Electricity_Consumption", "Customer_Comments"];
    const groups = data.map(d => d.Quarter);

    const x = d3.scaleBand()
      .domain(groups)
      .range([0, width])
      .padding(0.1);

    const xSub = d3.scaleBand()
      .domain(categories)
      .range([0, x.bandwidth()])
      .padding(0.08);

    const y = d3.scaleLinear()
      .domain([0, 7940.0])
      .nice()
      .range([height, 0]);

    const color = d3.scaleOrdinal().domain(categories).range(d3.schemeCategory10);

    const xAxis = svg.append("g")
      .attr("transform", "translate(0," + height + ")")
      .call(d3.axisBottom(x));
    xAxis.append("text")
      .attr("x", width / 2)
      .attr("y", 40)
      .style("text-anchor", "middle")
      .text("Quarter");

    const yAxis = svg.append("g").call(d3.axisLeft(y));
    yAxis.append("text")
      .attr("transform", "rotate(-90)")
      .attr("x", -height / 2)
      .attr("y", -50)
      .style("text-anchor", "middle")
      .text("Performance Indicators");

    const group = svg.selectAll(".quarter-group")
      .data(data)
      .enter().append("g")
      .attr("class", "quarter-group")
      .attr("transform", d => "translate(" + x(d.Quarter) + ",0)");

    group.selectAll("rect")
      .data(d => categories.map(key => ({key, value: d[key]})))
      .enter().append("rect")
      .attr("x", d => xSub(d.key))
      .attr("y", d => y(d.value))
      .attr("height", d => height - y(d.value))
      .attr("width", xSub.bandwidth())
      .attr("fill", d => color(d.key));

    group.selectAll("text.value")
      .data(d => categories.map(key => ({key, value: d[key]})))
      .enter().append("text")
      .attr("class", "value")
      .attr("x", d => xSub(d.key) + xSub.bandwidth() / 2)
      .attr("y", d => y(d.value) - 4)
      .attr("text-anchor", "middle")
      .style("font-size", "10px")
      .text(d => d.value);

    const legendLabels = {"Store_Visits": "Store Visits (Count)", "Electricity_Consumption": "Electricity Consumption (kWh)", "Customer_Comments": "Customer Comments (Count)"};
    const legend = svg.selectAll(".legend")
      .data(categories)
      .enter().append("g")
      .attr("class", "legend")
      .attr("transform", (d, i) => "translate(" + i * 200 + ",-10)");

    legend.append("rect")
      .attr("x", 0)
      .attr("width", 18)
      .attr("height", 18)
      .style("fill", d => color(d));

    legend.append("text")
      .attr("x", 24)
      .attr("y", 9)
      .attr("dy", ".35em")
      .style("text-anchor", "start")
      .style("font-size", "12px")
      .text(d => legendLabels[d] || d);
  </script>
</body>
</html>
