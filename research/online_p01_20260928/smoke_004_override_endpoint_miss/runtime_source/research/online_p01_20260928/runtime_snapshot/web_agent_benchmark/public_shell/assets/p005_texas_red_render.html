<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>US Choropleth with State Labels - Texas Red Render</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
        }
        h1 {
            margin: 18px 0 8px;
            font-size: 32px;
        }
        #map {
            width: 1000px;
            height: 700px;
            position: relative;
        }
        .legend {
            font-size: 14px;
        }
        .state-label {
            font-size: 10px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>US Population by State (in Millions)</h1>
    <div id="map"></div>

    <script>
        const width = 1000;
        const height = 700;
        const texasFips = "48";

        const csvRows = [
            {id: "06", State: "California", Population: 39.5},
            {id: "48", State: "Texas", Population: 30.1},
            {id: "12", State: "Florida", Population: 27.5},
            {id: "36", State: "New York", Population: 19.5},
            {id: "17", State: "Illinois", Population: 12.7},
            {id: "42", State: "Pennsylvania", Population: 12.8},
            {id: "39", State: "Ohio", Population: 11.7},
            {id: "13", State: "Georgia", Population: 10.6},
            {id: "26", State: "Michigan", Population: 10.0},
            {id: "37", State: "North Carolina", Population: 10.4}
        ];

        const svg = d3.select("#map")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const projection = d3.geoAlbersUsa()
            .scale(1300)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath(projection);

        const colorScale = d3.scaleThreshold()
            .domain([5, 10, 20, 30])
            .range([
                "#e41a1c",
                "#377eb8",
                "#4daf4a",
                "#984ea3",
                "#ff7f00"
            ]);

        d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us => {
            const popById = {};
            csvRows.forEach(d => {
                popById[d.id] = {
                    name: d.State,
                    pop: +d.Population
                };
            });

            const states = topojson.feature(us, us.objects.states).features;

            svg.selectAll("path")
                .data(states)
                .enter()
                .append("path")
                .attr("d", path)
                .attr("fill", d => {
                    const fips = d.id.toString().padStart(2, "0");
                    const info = popById[fips];
                    if (!info) {
                        return "#ddd";
                    }
                    if (fips === texasFips) {
                        return "#e41a1c";
                    }
                    return colorScale(info.pop);
                })
                .attr("stroke", "#fff")
                .attr("stroke-width", 1);

            svg.selectAll(".state-label")
                .data(states)
                .enter()
                .append("text")
                .attr("class", "state-label")
                .attr("transform", d => {
                    const [x, y] = path.centroid(d);
                    if (isNaN(x) || isNaN(y)) {
                        return "translate(0, 0)";
                    }
                    return `translate(${x}, ${y})`;
                })
                .text(d => {
                    const fips = d.id.toString().padStart(2, "0");
                    const info = popById[fips];
                    return info ? info.name : "";
                });

            const domain = colorScale.domain();
            const range = colorScale.range();
            const legendData = [{color: range[0], min: 0, max: domain[0]}];
            for (let i = 1; i < domain.length; i++) {
                legendData.push({
                    color: range[i],
                    min: domain[i - 1],
                    max: domain[i]
                });
            }
            legendData.push({
                color: range[range.length - 1],
                min: domain[domain.length - 1],
                max: Infinity
            });

            const legend = svg.append("g")
                .attr("class", "legend")
                .attr("transform", "translate(900, 400)");

            legend.selectAll("rect")
                .data(legendData)
                .enter()
                .append("rect")
                .attr("x", 0)
                .attr("y", (_, i) => i * 25)
                .attr("width", 20)
                .attr("height", 20)
                .attr("fill", d => d.color);

            legend.selectAll("text")
                .data(legendData)
                .enter()
                .append("text")
                .attr("x", 30)
                .attr("y", (_, i) => i * 25 + 14)
                .text(d => {
                    if (d.max === Infinity) {
                        return `${d.min}+ M`;
                    }
                    return `${d.min} - ${d.max} M`;
                });
        });
    </script>
</body>
</html>
