<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Usage Share by Product</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    #chart { width: 1000px; height: 750px; margin: 40px auto; }
    .text { font-size: 24px; font-weight: bold; fill: black; }
    .axis path, .axis line { stroke: black; }
  </style>
</head>
<body>
  <h1>Browser Usage Share by Product</h1>
  <div id="chart"></div>
  <script>
    const margin = { top: 20, right: 20, bottom: 40, left: 60 };
    const width = 1000 - margin.left - margin.right;
    const height = 750 - margin.top - margin.bottom;
    const svg = d3.select("#chart").append("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
      .append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const data = [{"category": "Chrome", "market_share": 73.0, "color": "#8E44AD"}, {"category": "Safari", "market_share": 12.0, "color": "#C70039"}, {"category": "Edge", "market_share": 2.0, "color": "#34C759"}, {"category": "Firefox", "market_share": 6.0, "color": "#007AFF"}, {"category": "Others", "market_share": 7.0, "color": "#F39C12"}];
    const x = d3.scaleBand()
      .domain(data.map(d => d.category))
      .range([0, width])
      .padding(0.3);
    const y = d3.scaleLinear()
      .domain([0, 100.0])
      .range([height, 0]);

    svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x));
    svg.append("g").call(d3.axisLeft(y));

    svg.selectAll(".bar").data(data).enter().append("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.category))
      .attr("y", d => y(d.market_share))
      .attr("width", x.bandwidth())
      .attr("height", d => height - y(d.market_share))
      .attr("fill", d => d.color);

    svg.selectAll(".text").data(data).enter().append("text")
      .attr("class", "text")
      .attr("x", d => x(d.category) + x.bandwidth() / 2)
      .attr("y", d => y(d.market_share) - 10)
      .attr("text-anchor", "middle")
      .text(d => `${d.market_share}%`);
  </script>
</body>
</html>
